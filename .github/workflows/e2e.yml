name: End-to-end

on:
  workflow_dispatch:
    inputs:
      relctl-version:
        description: "relctl version to test (e.g. '2.6.0' or 'latest')"
        default: "latest"
        required: false
        type: string
      relctl-ref:
        description: "Build relctl from this ref of layer87-labs/relctl (branch, tag or SHA) instead of installing a release. Tests a pull request before it is released."
        default: ""
        required: false
        type: string
      scenario:
        description: "Only run scenarios whose name contains this text (empty = all)"
        default: ""
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: write
  pull-requests: write

# Scenarios rewrite the sandbox: never run two at once.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  scripts:
    name: Script self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/test-lib.sh

  e2e:
    name: Scenarios
    runs-on: ubuntu-latest
    needs: [scripts]
    steps:
      - uses: actions/checkout@v6

      - name: Install relctl
        if: ${{ inputs.relctl-ref == '' }}
        uses: layer87-labs/relctl-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          relctl-version: ${{ inputs.relctl-version || 'latest' }}

      - name: Build relctl from source
        if: ${{ inputs.relctl-ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: layer87-labs/relctl
          ref: ${{ inputs.relctl-ref }}
          path: relctl-src

      - name: Install built relctl
        if: ${{ inputs.relctl-ref != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: relctl-src/go.mod

      - name: Compile relctl
        if: ${{ inputs.relctl-ref != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/relctl-bin"
          (cd relctl-src && go build -o "$RUNNER_TEMP/relctl-bin/relctl" ./cmd/relctl)
          echo "$RUNNER_TEMP/relctl-bin" >> "$GITHUB_PATH"

      - name: Run scenarios
        run: scripts/run-all.sh "${{ inputs.scenario }}"
        env:
          # A dedicated token (secret E2E_TOKEN) is preferred; the workflow token works
          # if the repository allows GitHub Actions to create and approve pull requests.
          GH_TOKEN: ${{ secrets.E2E_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.E2E_TOKEN || secrets.GITHUB_TOKEN }}
